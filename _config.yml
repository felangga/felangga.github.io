---
title: felangga
timezone: Asia/Jakarta
collections:
  posts:
    title: Posts
    output: true
  tabs:
    title: Tabs
    output: true
    sort_by: order
  uploads:
    title: Uploads
    output: true
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: post
    comments: true
    toc: true
    permalink: "/posts/:title/"
- scope:
    path: _drafts
  values:
    comments: false
- scope:
    path: ''
    type: tabs
  values:
    layout: page
    permalink: "/:title/"
- scope:
    path: assets/img/favicons
  values:
    swcache: true
- scope:
    path: assets/js/dist
  values:
    swcache: true
theme: jekyll-theme-chirpy
plugins:
- jekyll-archives
- jekyll-paginate
- jekyll-sitemap
- jekyll-seo-tag
baseurl: ''
lang: en
tagline: Personal blog and projects
description: 'Personal blog and projects. Retro computing, 486 builds, vintage Macintosh repairs and Raspberry Pi tinkering.'
url: https://felangga.github.io
# Dipakai jekyll-seo-tag untuk <meta name="author">, meta twitter:creator,
# dan field "author" di JSON-LD BlogPosting.
author:
  name: felangga
  url: https://github.com/felangga
  twitter: erlandhita
# Logo untuk entri "publisher" di JSON-LD (butuh gambar persegi).
logo: https://felangga.github.io/assets/img/favicons/felangga-512x512.png
# og:image situs. Ditimpa per-post kalau post punya `image:` di front matter.
# Sengaja URL absolut: media-url.html melewati CDN kalau src mengandung ':'.
social_preview_image: https://felangga.github.io/assets/img/og-preview.png
github:
  username: felangga
twitter:
  username: erlandhita
social:
  name: felangga
  email: felangga@gmail.com
  links:
  - https://twitter.com/erlandhita
  - https://github.com/felangga
# Search Console / Bing. Key lama `google_site_verification` tidak pernah
# dirender: theme Chirpy punya blok `webmaster_verifications`, sehingga cabang
# `elsif site.google_site_verification` di jekyll-seo-tag jadi unreachable.
webmaster_verifications:
  google: 
  bing: 
google_analytics:
  id: 
  pv:
    proxy_endpoint: 
    cache_path: 
theme_mode: light  # was dark
# Dikosongkan supaya theme tidak memakai CDN default-nya (chirpy-img.netlify.app)
# untuk media ber-path relatif. `img_cdn` adalah nama key versi Chirpy lama.
cdn: 
avatar: https://avatars.githubusercontent.com/u/14814984?s=400&v=4
toc: true
comments:
  provider: giscus
  disqus:
    shortname: 
  utterances:
    repo: 
    issue_term: 
  giscus:
    repo: felangga/felangga.github.io
    repo_id: R_kgDOJbiJUQ
    category: Q&A
    category_id: DIC_kwDOJbiJUc4CWxmt
    mapping: pathname
    input_position: 
    lang: 
    reactions_enabled: 
assets:
  self_host:
    enabled: 
    env: 
pwa:
  enabled: true
paginate: 10
# Feed Atom: theme Chirpy meng-hardcode `limit: 5` di assets/feed.xml, jadi key
# di bawah ini hanya berpengaruh setelah assets/feed.xml milik site menimpanya.
feed:
  posts_limit: 20
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
sass:
  style: compressed
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs:
    - development
exclude:
- "*.gem"
- "*.gemspec"
- tools
- README.md
- CHANGELOG.md
- LICENSE
- rollup.config.js
- node_modules
- package*.json
jekyll-archives:
  enabled:
  - categories
  - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: "/tags/:name/"
    category: "/categories/:name/"
