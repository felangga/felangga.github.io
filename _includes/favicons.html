<!--
  Favicons for this site, generated from the owner's avatar.
  IMPORTANT: filenames are prefixed with "felangga-" on purpose. The theme
  (jekyll-theme-chirpy) ships its own files at assets/img/favicons/favicon.ico
  etc., and Jekyll writes theme static files AFTER site static files, so the
  theme's copies silently overwrite same-named site files. Unique names avoid
  that collision entirely.
-->
{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}

<link rel="icon" type="image/png" href="{{ favicon_path }}/felangga-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="{{ favicon_path }}/felangga.svg">
<link rel="shortcut icon" href="{{ favicon_path }}/felangga.ico">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/felangga-apple-touch-icon.png">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/felangga.webmanifest">
{% endif %}

<!--
  Autodiscovery feed Atom. Chirpy tidak pernah memanggil tag feed_meta milik
  jekyll-feed (bahkan jekyll-feed tidak ada di Gemfile), dan theme memakai
  include_cached favicons.html di dalam head, jadi file inilah satu-satunya
  include di head yang bisa kita miliki tanpa menyalin head.html milik theme.
  CATATAN: jangan tulis tag Liquid apa pun di dalam komentar ini, Liquid tetap
  merendernya walau berada di dalam komentar HTML.
-->
<link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
